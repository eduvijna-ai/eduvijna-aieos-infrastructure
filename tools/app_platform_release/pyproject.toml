[project]
name = "aieos-app-release"
version = "0.1.0"
description = "AIEOS App Platform state-free release controller library (WPI-AP-DP-I01 offline foundation)"
requires-python = "==3.14.7"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aieos_app_release"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
