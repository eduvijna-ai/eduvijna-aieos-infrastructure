name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  opentofu-validate:
    name: opentofu-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5

      - name: Prove exact OpenTofu version
        run: |
          tofu version
          ver="$(tofu version -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["terraform_version"])')"
          test "$ver" = "1.12.5"

      - name: Secret / apply / local-state guards
        working-directory: .
        run: bash scripts/guard.sh

      - name: Format check
        working-directory: .
        run: tofu fmt -check -recursive

      - name: Init without backend (no production state)
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate

      - name: Prove enable_cloud_resources remains false by default
        working-directory: .
        run: |
          awk '/variable "enable_cloud_resources"/,/^}/' environments/production/variables.tf \
            | grep -E '^\s*default\s*=\s*false\s*$'

      - name: Prove enable_temporal_cloud_resources remains false by default
        working-directory: .
        run: |
          awk '/variable "enable_temporal_cloud_resources"/,/^}/' environments/production/variables.tf \
            | grep -E '^\s*default\s*=\s*false\s*$'

      - name: Prove lockfile pins DigitalOcean 2.99.1 and Temporal Cloud 1.7.0
        working-directory: .
        run: |
          test -f environments/production/.terraform.lock.hcl
          grep -q 'version.*=.*"2.99.1"' environments/production/.terraform.lock.hcl
          grep -q 'version.*=.*"1.7.0"' environments/production/.terraform.lock.hcl

      - name: Prove CI has no DigitalOcean or Temporal Cloud credentials
        run: |
          if [ -n "${DIGITALOCEAN_TOKEN:-}" ]; then
            echo "DIGITALOCEAN_TOKEN must not be present in foundation CI" >&2
            exit 1
          fi
          if [ -n "${TEMPORAL_CLOUD_API_KEY:-}" ]; then
            echo "TEMPORAL_CLOUD_API_KEY must not be present in foundation CI" >&2
            exit 1
          fi

      - name: Validate Temporal Cloud provisioning-source static proofs
        working-directory: .
        run: bash scripts/temporal/validate-provisioning-source.sh

  postgresql-identity-bootstrap:
    name: postgresql-identity-bootstrap
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_bootstrap_only
          POSTGRES_DB: aieos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aieos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: aieos_ci
      PGUSER: postgres
      PGPASSWORD: ci_bootstrap_only
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prove PostgreSQL major version 18
        run: |
          version_line="$(psql -Atqc "SELECT version()")"
          case "$version_line" in
            PostgreSQL\ 18.*) ;;
            *) echo "expected PostgreSQL 18.x, got: $version_line" >&2; exit 1 ;;
          esac

      - name: Secret / apply / local-state guards
        run: bash scripts/guard.sh

      - name: Run disposable identity bootstrap CI proof
        run: bash scripts/postgresql/ci-test-bootstrap.sh

  nats-production-event-plane:
    name: nats-production-event-plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Secret / apply / local-state guards
        run: bash scripts/guard.sh

      - name: Validate production event-plane contract exactness
        run: bash scripts/nats/validate-contract.sh

      - name: Disposable JWT+NKey ACL proof (nats-server 2.14.3)
        run: bash scripts/nats/ci-test-event-plane.sh

  temporal-production-workflow-plane:
    name: temporal-production-workflow-plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Secret / apply / local-state guards
        run: bash scripts/guard.sh

      - name: Validate production Temporal workflow-plane contract exactness
        run: bash scripts/temporal/validate-contract.sh

      - name: Validate Temporal Cloud provisioning-source static proofs
        run: bash scripts/temporal/validate-provisioning-source.sh

      - name: Prove CI has no Temporal Cloud credential
        run: |
          if [ -n "${TEMPORAL_CLOUD_API_KEY:-}" ]; then
            echo "TEMPORAL_CLOUD_API_KEY must not be present in foundation CI" >&2
            exit 1
          fi
